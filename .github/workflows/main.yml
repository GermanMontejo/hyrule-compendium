name: Hyrule-Compendium CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering of the workflow.
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: gradle

    - name: Make Gradle executable
      run: chmod +x ./gradlew
        
    - name: Build with Gradle
      run: ./gradlew build assembleDebug

    - name: Run Tests
      run: ./gradlew test
