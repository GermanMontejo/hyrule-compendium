name: Hyrule-Compendium CI

on:
  push:
    branches:
      - main
  pull_request: # This ensures the workflow will execute on all pull requests.
  workflow_dispatch: # Allows manual triggering of the workflow.
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v2

    - name: Set up JDK 11
      uses: actions/setup-java@v2
      with:
        java-version: '11'
        distribution: 'adopt'
        cache: gradle

    - name: Make Gradle executable
      run: chmod +x ./gradlew
        
    - name: Build with Gradle
      run: ./gradlew build assembleDebug

    - name: Run Tests
      run: ./gradlew test
