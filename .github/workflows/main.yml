name: Hyrule-Compendium CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v2

    - name: Set up JDK 11
      uses: actions/setup-java@v2
      with:
        java-version: '11'
        distribution: 'adopt'

    - name: Make Gradle executable
      run: chmod +x ./gradlew
        
    - name: Build with Gradle
      run: ./gradlew build

    - name: Run Tests
      run: ./gradlew test
